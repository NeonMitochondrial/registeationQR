<!DOCTYPE html>
<html>
<head>
  <base target="_top">

<style>

body{
font-family:"Segoe UI",Arial,sans-serif;
background:#f4f7f6;
margin:0;
padding:30px 0;
display:flex;
justify-content:center;
}

#mensajeAyuda{
position:fixed;
top:10px;
right:15px;
background:rgba(255,255,255,0.95);
padding:8px 14px;
border-radius:6px;
font-size:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
z-index:9999;
}

.container{
background:#ffffff;
padding:30px;
border-radius:12px;
width:420px;
box-shadow:0 4px 18px rgba(0,0,0,0.15);
text-align:center;
}

.header img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

h2{
margin:10px 0 25px 0;
color:#2f3640;
font-weight:700;
font-size:22px;
}

label{
font-weight:600;
color:#2f3640;
display:block;
margin-top:6px;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border:2px solid #dcdfe1;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

.btn{
width:100%;
padding:12px;
border:none;
background:#27ae60;
color:white;
border-radius:8px;
margin-top:14px;
font-size:16px;
cursor:pointer;
font-weight:600;
}

.btn:hover{background:#1e8449;}

.btn-red{background:#c0392b;}
.btn-red:hover{background:#922b21;}

#cameraContainer{
display:none;
margin-top:20px;
}

video{
width:100%;
border-radius:10px;
border:2px solid #dcdfe1;
}

canvas{display:none;}

.alerta-datos{
background:#fff4cc;
padding:12px;
margin-top:20px;
border-radius:8px;
font-weight:bold;
color:#8a6d00;
}

.datos-box{
background:#eef1ef;
padding:15px;
border-radius:8px;
margin-top:18px;
text-align:left;
}

#modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.55);
justify-content:center;
align-items:center;
z-index:9999;
}

#modalContent{
background:white;
padding:25px;
border-radius:10px;
text-align:center;
width:300px;
}

.spinner{
border:4px solid #f3f3f3;
border-top:4px solid #27ae60;
border-radius:50%;
width:30px;height:30px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{100%{transform:rotate(360deg)}}

</style>
</head>

<body>

<div class="container">

<div class="header">
<img src="https://i.postimg.cc/NM0Vf2rx/brave-screenshot-scontent-flim15-2-fna-fbcdn-net.png">
</div>

<h2>Consulta de Participantes</h2>

<label>DNI / CE</label>
<input type="text" id="dni" placeholder="Ingrese DNI o CE">

<button class="btn" onclick="buscar()">BUSCAR</button>

<button class="btn" onclick="iniciarQR()">📷 ESCANEAR QR</button>

<div id="cameraContainer">

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<button class="btn btn-red" onclick="detenerQR()">❌ DETENER</button>

<p id="qrText"></p>

</div>

<div id="resultado"></div>

</div>

<!-- MODAL -->
<div id="modal">
<div id="modalContent">
<div class="spinner"></div>
<p id="modalTexto">Cargando...</p>
</div>
</div>

<script>

let stream=null;
let interval=null;

/* ================= BUSCAR ================= */
function buscar(){

const dni=document.getElementById("dni").value.trim();
if(!dni){alert("Ingrese DNI");return;}

mostrarModal("Buscando...");

google.script.run.withSuccessHandler(res=>{

cerrarModal();

if(!res){
document.getElementById("resultado").innerHTML="❌ No encontrado";
return;
}

document.getElementById("resultado").innerHTML=`
<div class="datos-box">
<p><b>Nombre:</b> ${res.nombre}</p>
<p><b>DNI:</b> ${res.dni}</p>
<p><b>Categoría:</b> ${res.categoria}</p>
<p><b>Nota:</b> ${res.nota}</p>
</div>
`;

}).buscarPorDNI(dni);

}

/* ================= MODAL ================= */
function mostrarModal(t){
document.getElementById("modalTexto").innerText=t;
document.getElementById("modal").style.display="flex";
}
function cerrarModal(){
document.getElementById("modal").style.display="none";
}

/* ================= QR ================= */
async function iniciarQR(){

try{

const video=document.getElementById("video");

if(stream) stream.getTracks().forEach(t=>t.stop());

stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:false
});

video.srcObject=stream;
await video.play();

document.getElementById("cameraContainer").style.display="block";

interval=setInterval(escanear,500);

}catch(e){
alert("No se pudo abrir cámara");
console.error(e);
}

}

function detenerQR(){

if(interval) clearInterval(interval);
interval=null;

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

document.getElementById("cameraContainer").style.display="none";
document.getElementById("qrText").innerText="";
}

/* ================= ESCANEO ================= */
function escanear(){

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

if(video.readyState<2) return;

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0);

if(!('BarcodeDetector' in window)){
document.getElementById("qrText").innerText="No soporta QR en este navegador";
return;
}

const detector=new BarcodeDetector({formats:["qr_code"]});

detector.detect(canvas).then(codes=>{

if(codes.length>0){

const qr=codes[0].rawValue;

document.getElementById("qrText").innerText="QR: "+qr;

document.getElementById("dni").value=qr;

buscar();

detenerQR();

}

});

}

</script>

</body>
</html>
